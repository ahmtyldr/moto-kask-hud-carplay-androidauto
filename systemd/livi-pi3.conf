# /etc/systemd/system/livi-kiosk.service.d/livi-pi3.conf
#
# Raspberry Pi 3 video fix. See docs/pi3-video-fix.md for the full analysis.
#
# LIVI only inserts a videoconvert element when it picks a SOFTWARE decoder:
#
#     if (!is_hw_decoder(decoder)) presink = "videoconvert ! ";   gst_video.cc:424
#
# On a Pi 4/5 the hardware decoder hands waylandsink DMABuf frames, which it
# accepts as NV12/I420, so no conversion is needed. On a Pi 3 the bcm2835
# decoder delivers I420 in system memory, and waylandsink only accepts RGB
# there — the pipeline fails with "not-negotiated (-4)" and no frame is drawn.
#
# The sink chain is overridable, and the value is pasted into the pipeline
# description verbatim, so a whole chain can be injected there:
#
#     const char* sink_env = getenv("LIVI_GST_SINK");                gst_video.cc:259
#     return std::string(sink_env && *sink_env ? sink_env : "waylandsink")
#          + " name=sink sync=false";
#
# That keeps the codec nodes visible, so the hardware decoder is still chosen
# and p.h264.hw stays true — which also stops CodecCapabilityService from
# advertising HEVC, so the phone sends H.264 instead.
#
# The bare video/x-raw capsfilter is the part that actually matters. Adding
# videoconvert on its own is NOT enough: negotiation still settles on DMABuf and
# fails the same way. Pinning the caps to plain system memory — which is what
# the decoder delivers — is what makes the two ends agree.
#
# Verified on a Pi 3B+, wired Android Auto:
#
#     [gst_video] codec=h264 decoder=v4l2h264dec (hw) | appsrc ! h264parse
#                 ! queue ! v4l2h264dec name=dec ! queue leaky=downstream
#                 ! video/x-raw ! videoconvert n-threads=4 ! waylandsink
#     [gst_video] decoded format=I420 1280x720 mem=memory:SystemMemory
#     [Session] ★ phone picked video codec: H264 (offered: h264)
#     not-negotiated errors: 0
#
# n-threads=4 needs a videoconvert that carries the property. The GStreamer
# 1.28.4 bundled in the v8.3.0 AppImage does; check before changing versions:
#
#     strings .../gstreamer-1.0/libgstvideoconvertscale.so | grep -x n-threads
#
# Cost: the conversion and the copy out of the decoder's CMA buffer still run on
# the CPU, roughly two cores at 1280x720@30. patches/0003-pi3-dmabuf-capture.patch
# removes both by making the decoder export dmabuf instead.
#
# Fallback, if this ever stops negotiating: replace the two Environment lines
# with InaccessiblePaths=/dev/video10 /dev/video11 /dev/video12, which forces the
# software decoder. That draws a picture too, but the phone then picks HEVC and
# the CPU decodes it in software.

[Service]
Environment="LIVI_GST_SINK=video/x-raw ! videoconvert n-threads=4 ! waylandsink"
StandardOutput=append:/var/log/livi-kiosk.log
StandardError=append:/var/log/livi-kiosk.log
